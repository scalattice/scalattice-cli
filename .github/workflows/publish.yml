name: Publish npm

# Pushes to development bump package.json (patch) and publish to npm.
# production is the stable default branch; merge from development when ready.
on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish to bump patch and publish from this branch'
        required: true
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.confirm == 'publish'
      || github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Sync version from npm then bump patch
        run: |
          set -euo pipefail
          PUBLISHED="$(npm view scalattice-cli version 2>/dev/null || true)"
          LOCAL="$(node -p "require('./package.json').version")"
          if [ -n "$PUBLISHED" ]; then
            echo "Syncing package.json to npm $PUBLISHED (was $LOCAL)"
            PUBLISHED="$PUBLISHED" node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = process.env.PUBLISHED;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
          else
            echo "No published version yet; bumping from local $LOCAL"
          fi
          npm version patch --no-git-tag-version
          echo "NEXT=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Smoke test
        run: node ./bin/scalattice.js --help >/dev/null

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: github.event_name == 'push' || github.ref_name == 'development'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --staged --quiet; then
            echo "No version file change to commit"
            exit 0
          fi
          git commit -m "chore: release ${NEXT} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
